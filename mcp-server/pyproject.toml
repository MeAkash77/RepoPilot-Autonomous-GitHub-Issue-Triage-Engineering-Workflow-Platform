[project]
name = "repopilot-mcp"
version = "0.1.0"
description = "MCP server exposing RepoPilot triage tools to Claude Desktop and IDEs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "mcp>=1.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
repopilot-mcp = "repopilot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_mcp"]
