[project]
name = "repopilot-llm"
version = "0.1.0"
description = "LLM router, embedding provider, and reranker abstractions for RepoPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_llm"]
