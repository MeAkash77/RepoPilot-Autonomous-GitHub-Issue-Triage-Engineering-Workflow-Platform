[project]
name = "repopilot-core"
version = "0.1.0"
description = "Domain models, database layer, and settings for RepoPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "pgvector>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_core"]
