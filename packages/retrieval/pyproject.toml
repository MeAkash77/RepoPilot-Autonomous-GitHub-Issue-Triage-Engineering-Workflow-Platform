[project]
name = "repopilot-retrieval"
version = "0.1.0"
description = "Ingestion pipeline, chunkers, hybrid search, and reranking for RepoPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "repopilot-llm",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_retrieval"]
