[project]
name = "repopilot-github"
version = "0.1.0"
description = "GitHub App client, webhook verification, and action executor for RepoPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.10.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_github"]
