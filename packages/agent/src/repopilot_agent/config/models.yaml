# Per-node model routing. Costs are $/M tokens (used for run accounting).
# Fast/cheap routes default to Groq Llama; long-context routes use Gemini
# Flash; `escalation` is the single stronger-model retry for low-confidence
# nodes (max one per run, enforced by the graph).
# fallback_provider/model: used when primary fails or circuit-breaker opens.
routes:
  condense_query:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.0
    input_cost_per_mtok: 0.59
    output_cost_per_mtok: 0.79
    fallback_provider: gemini
    fallback_model: gemini-2.0-flash
  classify:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.0
    input_cost_per_mtok: 0.59
    output_cost_per_mtok: 0.79
    fallback_provider: gemini
    fallback_model: gemini-2.0-flash
  duplicate_check:
    provider: gemini
    model: gemini-2.0-flash
    temperature: 0.0
    input_cost_per_mtok: 0.10
    output_cost_per_mtok: 0.40
    fallback_provider: groq
    fallback_model: llama-3.3-70b-versatile
  info_gap:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.2
    input_cost_per_mtok: 0.59
    output_cost_per_mtok: 0.79
    fallback_provider: gemini
    fallback_model: gemini-2.0-flash
  escalation:
    provider: gemini
    model: gemini-2.5-pro
    temperature: 0.0
    input_cost_per_mtok: 1.25
    output_cost_per_mtok: 10.00
    fallback_provider: groq
    fallback_model: llama-3.3-70b-versatile
