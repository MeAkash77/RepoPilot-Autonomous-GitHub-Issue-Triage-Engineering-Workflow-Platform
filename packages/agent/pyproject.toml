[project]
name = "repopilot-agent"
version = "0.1.0"
description = "LangGraph triage agent: graph, nodes, prompts, guardrails"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "repopilot-llm",
    "repopilot-retrieval",
    "repopilot-github",
    "langgraph>=0.2.50",
    "langfuse>=2.59,<3",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_agent"]
