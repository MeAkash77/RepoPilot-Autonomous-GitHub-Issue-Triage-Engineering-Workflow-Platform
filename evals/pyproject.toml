[project]
name = "repopilot-evals"
version = "0.1.0"
description = "Golden datasets, judges, runners, and CI gates for RepoPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "repopilot-agent",
    "pytest>=8.3.0",
    "langfuse>=2.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_evals"]
