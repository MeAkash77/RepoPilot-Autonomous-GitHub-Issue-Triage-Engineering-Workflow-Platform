app = "repopilot-api"
primary_region = "sin"

[build]
  dockerfile = "infra/Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 200
  soft_limit = 150

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
