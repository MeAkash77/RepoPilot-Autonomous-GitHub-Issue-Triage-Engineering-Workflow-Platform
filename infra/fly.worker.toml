app = "repopilot-worker"
primary_region = "sin"

[build]
  dockerfile = "infra/Dockerfile.worker"

# No http_service — this is a pure background process (arq job consumer).
# Fly keeps it running via the process supervisor; no port exposed.

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
