[project]
name = "repopilot-api"
version = "0.1.0"
description = "RepoPilot FastAPI service: webhooks, REST API, SSE streaming"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "repopilot-github",
    "repopilot-llm",
    "repopilot-retrieval",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "slowapi>=0.1.10",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = ["httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_api"]
