[project]
name = "repopilot-worker"
version = "0.1.0"
description = "RepoPilot arq worker: consumes triage jobs, runs the agent graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "repopilot-core",
    "repopilot-agent",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_worker"]
